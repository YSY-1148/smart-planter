[env:disco_f407vg]
platform = ststm32@19.4.0
board = disco_f407vg
framework = stm32cube
platform_packages = platformio/framework-stm32cubef4@1.28.3
upload_protocol = stlink
lib_deps = PlanterCommon=symlink://../common
extra_scripts = pre:scripts/freertos.py
build_flags = -Iinclude -Wall -Wextra -D HSE_VALUE=8000000U -mfpu=fpv4-sp-d16 -mfloat-abi=softfp
