services:
  broker:
    image: eclipse-mosquitto:2.0.21
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwords:/mosquitto/config/passwords:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - mqtt_data:/mosquitto/data
  app:
    build: .
    restart: unless-stopped
    depends_on:
      - broker
    environment:
      DEVICE_ID: ${DEVICE_ID:-planter-001}
      MQTT_HOST: broker
      MQTT_PORT: "8883"
      MQTT_USER: cloud
      MQTT_PASSWORD: ${CLOUD_MQTT_PASSWORD:?Run tools/provision.py first}
      MQTT_CA: /certs/ca.crt
      API_KEY: ${API_KEY:?Run tools/provision.py first}
      DB_PATH: /data/planter.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./mosquitto/certs/ca.crt:/certs/ca.crt:ro
      - app_data:/data
volumes:
  mqtt_data:
  app_data:
